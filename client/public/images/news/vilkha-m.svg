<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#grid)"/>

  <!-- Tactical HUD border elements -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
  <path d="M 30 430 L 30 450 L 50 450" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
  <path d="M 770 430 L 770 450 L 750 450" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>

  <!-- Center Card Frame -->
  <rect x="70" y="60" width="660" height="360" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Watermark -->
  <text x="700" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.2)" text-anchor="end" letter-spacing="2">ВПК УКРАЇНИ // ОБОРОННИЙ ПОРТАЛ</text>
  <text x="100" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ef4444" letter-spacing="1.5">● СТАТУС: НА ОЗБРОЄННІ ЗСУ</text>

  <!-- Central weapon icon & glow -->
  <circle cx="400" cy="180" r="75" fill="#ef4444" opacity="0.15"/>
  <circle cx="400" cy="180" r="55" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="400" y="200" font-size="64" text-anchor="middle">🎯</text>

  <!-- Category badge -->
  <rect x="330" y="90" width="140" height="28" rx="14" fill="#ef4444" opacity="0.25"/>
  <rect x="330" y="90" width="140" height="28" rx="14" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">АРТИЛЕРІЯ</text>

  <!-- Title -->
  <text x="400" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">РСЗВ "ВІЛЬХА-М"</text>

  <!-- Tech Specs -->
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">Калібр 300 мм / Дальність 130 км / GPS-корекція</text>

  <!-- Accent lines -->
  <line x1="280" y1="365" x2="520" y2="365" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
</svg>